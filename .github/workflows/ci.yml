name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }} ${{ matrix.compiler }} C++${{ matrix.std }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, compiler: g++, std: 17 }
          - { os: ubuntu-latest, compiler: g++, std: 20 }
          - { os: ubuntu-latest, compiler: clang++, std: 17 }
          - { os: macos-latest, compiler: clang++, std: 17 }
          - { os: windows-latest, compiler: msvc, std: 20 }
    steps:
      - uses: actions/checkout@v7

      - name: Configure
        shell: bash
        run: |
          args=(-DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_STANDARD=${{ matrix.std }})
          if [ "${{ matrix.compiler }}" != "msvc" ]; then args+=(-DCMAKE_CXX_COMPILER=${{ matrix.compiler }}); fi
          cmake -S . -B build "${args[@]}"

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        working-directory: build
        run: ctest -C Release --output-on-failure

      - name: Test in a non-UTC time zone
        if: runner.os != 'Windows'
        working-directory: build
        env:
          TZ: America/New_York
        run: ctest -C Release --output-on-failure

  sanitizers:
    name: Sanitizers (${{ matrix.sanitizer }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sanitizer: ["address,undefined", "thread"]
    steps:
      - uses: actions/checkout@v7
      - name: Build and test
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_CXX_FLAGS="-fsanitize=${{ matrix.sanitizer }} -fno-omit-frame-pointer -fno-sanitize-recover=all"
          cmake --build build
          cd build && ctest --output-on-failure

  zoneinfo:
    name: Zoneinfo reader matches the C library
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build and compare
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target croner_tz_compare
          ./build/croner_tz_compare

  differential:
    name: Differential test against croner.js
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24.x"
      - name: Install croner.js
        working-directory: tests/differential
        run: npm install
      - name: Build driver
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target croner_differential_driver
      - name: Compare (UTC)
        working-directory: tests/differential
        run: npx tsx fuzz.ts ../../build/croner_differential_driver 50000 ${{ github.run_number }}
      - name: Compare (Europe/Stockholm system time)
        working-directory: tests/differential
        env:
          TZ: Europe/Stockholm
        run: npx tsx fuzz.ts ../../build/croner_differential_driver 20000 ${{ github.run_number }}
